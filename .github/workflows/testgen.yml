name: Testgen

on:
  pull_request:
    paths:
      - '**.go'
      - '!**_test.go'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Checkout testgen-agent
        uses: actions/checkout@v4
        with:
          repository: Klagvar/testgen-agent
          path: .testgen-agent-src
          ref: main

      - name: Build testgen-agent
        run: |
          cd .testgen-agent-src
          go build -o ../testgen-agent ./cmd/agent
          cd ..
          chmod +x testgen-agent
          ./testgen-agent --help | head -5 || true

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Run testgen-agent
        run: |
          ./testgen-agent \
            --repo . \
            --base "origin/${{ github.base_ref }}" \
            --api-url ${{ secrets.LLM_API_URL }} \
            --api-key ${{ secrets.LLM_API_KEY }} \
            --model ${{ vars.LLM_MODEL }} \
            --temperature 0 \
            --seed 42 \
            --report html,json \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --github-repo ${{ github.repository }} \
            --pr-number ${{ github.event.pull_request.number }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testgen-reports
          path: |
            testgen-report-*.json
            testgen-report-*.html
          if-no-files-found: ignore

      - name: Run go test on generated tests
        if: success()
        run: go test ./... -v -count=1

      - name: Commit generated tests
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/*_test.go' || true
          git diff --cached --quiet || (git commit -m "test: auto-generated by testgen-agent" && git push)
